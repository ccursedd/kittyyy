<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kittybin.lat · monochrome</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
            color: #e0e0e0;
        }

        /* black & white theme - monochrome elegance */
        .glass-card {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.2s ease;
        }

        #authWrapper {
            width: 100%;
            max-width: 440px;
            margin: 20px;
            opacity: 0;
            transform: translateY(15px);
            animation: slideUp 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        #app {
            width: 100%;
            max-width: 1300px;
            height: 90vh;
            margin: 20px;
            display: none;
            flex-direction: column;
            opacity: 0;
            transform: scale(0.97);
            animation: scaleIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { to { opacity: 1; transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }

        /* header with feline vibe */
        .app-header {
            padding: 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(14px);
            border-radius: 70px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px -10px black;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 1.6rem;
            letter-spacing: -0.5px;
            color: white;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .logo i { 
            font-size: 2rem; 
            color: #aaa;
            transition: transform 0.2s;
        }
        .logo:hover i {
            transform: rotate(5deg) scale(1.1);
        }
        .logo span {
            background: linear-gradient(135deg, #fff, #aaa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(30, 30, 30, 0.6);
            padding: 6px 12px 6px 6px;
            border-radius: 60px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s;
        }
        .user-badge:hover {
            background: #1a1a1a;
            border-color: rgba(255,255,255,0.2);
        }
        .avatar-small {
            width: 44px; height: 44px; border-radius: 44px;
            background: #2a2a2a;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 600; font-size: 1.2rem;
            background-size: cover; background-position: center;
            border: 2px solid #444;
            transition: border 0.2s;
        }
        .user-badge:hover .avatar-small { border-color: #888; }
        .badge-text { font-weight: 600; color: #eee; }
        .badge-handle { font-size: 0.75rem; color: #888; }

        /* profile dropdown (noir) */
        .dropdown-panel {
            position: absolute; top: 90px; right: 30px; width: 340px;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px -20px black;
            display: none;
            z-index: 300;
        }
        .dropdown-panel.show { display: block; animation: slideDown 0.25s ease; }

        .avatar-large {
            width: 90px; height: 90px; border-radius: 90px;
            background: #2a2a2a;
            margin: 0 auto 16px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 2.5rem; font-weight: 500;
            background-size: cover; background-position: center;
            border: 2px solid #555;
        }
        .profile-field { margin: 18px 0; }
        .profile-field label {
            font-weight: 600; font-size: 0.7rem; text-transform: uppercase;
            color: #aaa; margin-left: 10px; letter-spacing: 0.5px;
        }
        .profile-field input, .profile-field textarea {
            width: 100%; padding: 14px 20px; border-radius: 50px;
            border: 1px solid #333;
            background: #1a1a1a;
            margin-top: 5px; font-size: 0.95rem;
            color: #f0f0f0;
            transition: all 0.15s;
        }
        .profile-field input:focus, .profile-field textarea:focus {
            border-color: #888;
            outline: none;
            background: #222;
        }
        .profile-field textarea { border-radius: 24px; resize: vertical; min-height: 80px; }
        .avatar-upload {
            display: flex; gap: 8px;
            background: #1e1e1e;
            border-radius: 60px;
            padding: 6px;
            border: 1px solid #333;
        }
        .avatar-upload input {
            flex:1; border: none; background: transparent;
            padding: 8px 12px; color: #ccc;
        }
        .avatar-upload button {
            background: #333; border: none; color: white;
            padding: 10px 20px; border-radius: 40px;
            font-weight: 600; cursor: pointer; transition: 0.15s;
        }
        .avatar-upload button:hover { background: #555; }

        /* main layout */
        .explore-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 20px;
        }

        /* left sidebar - dark */
        .side-panel {
            width: 300px;
            background: rgba(15, 15, 15, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 44px;
            padding: 24px 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .my-profile-card {
            background: #111;
            border-radius: 36px;
            padding: 24px 16px;
            text-align: center;
            border: 1px solid #222;
            cursor: pointer;
            transition: 0.2s;
        }
        .my-profile-card:hover {
            background: #161616;
            border-color: #444;
            transform: translateY(-2px);
        }
        .my-avatar {
            width: 90px; height: 90px; border-radius: 90px;
            background: #2a2a2a;
            margin: 0 auto 12px;
            background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 2.4rem;
            border: 2px solid #444;
        }
        .my-name { font-size: 1.7rem; font-weight: 700; color: #eee; }
        .my-handle { color: #888; font-weight: 500; margin-bottom: 8px; }
        .my-bio { color: #aaa; margin: 16px 0 8px; font-size: 0.9rem; }
        .stat-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 16px 0;
        }
        .stat { text-align: center; }
        .stat-num { font-weight: 800; font-size: 1.3rem; color: white; }
        .stat-label { font-size: 0.7rem; color: #777; }

        .nav-button {
            background: rgba(20, 20, 20, 0.7);
            border: 1px solid #2a2a2a;
            border-radius: 40px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 600;
            color: #ccc;
            margin: 4px 0;
            cursor: pointer;
            transition: 0.15s;
            width: 100%;
        }
        .nav-button.active {
            background: #222;
            color: white;
            border-color: #555;
        }
        .nav-button:hover {
            background: #1f1f1f;
            border-color: #666;
        }
        .nav-button i { width: 28px; font-size: 1.3rem; }

        /* main content - black & white grid */
        .main-area {
            flex: 1;
            background: rgba(10, 10, 10, 0.4);
            backdrop-filter: blur(12px);
            border-radius: 44px;
            padding: 28px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #f0f0f0;
            letter-spacing: -0.5px;
        }

        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .profile-card {
            background: #111;
            border-radius: 32px;
            padding: 22px 16px;
            text-align: center;
            transition: all 0.25s cubic-bezier(0.2,0.9,0.3,1);
            border: 1px solid #222;
            cursor: pointer;
            animation: cardPop 0.3s;
        }
        @keyframes cardPop {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .profile-card:hover {
            background: #161616;
            border-color: #444;
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 30px -15px black;
        }
        .card-avatar {
            width: 80px; height: 80px; border-radius: 80px;
            background: #2a2a2a;
            margin: 0 auto 16px;
            background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 2rem;
            border: 2px solid #444;
            transition: border 0.2s;
        }
        .profile-card:hover .card-avatar { border-color: #888; }
        .card-name { font-weight: 700; font-size: 1.4rem; color: #f5f5f5; }
        .card-handle { color: #aaa; font-weight: 500; font-size: 0.85rem; margin: 4px 0; }
        .card-bio { color: #888; font-size: 0.85rem; margin: 12px 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .card-stats {
            display: flex; justify-content: center; gap: 16px; margin: 12px 0;
            font-size: 0.8rem; color: #777;
        }
        .action-btn {
            background: #2a2a2a;
            color: #eee;
            border: 1px solid #444;
            padding: 10px 16px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            margin: 4px;
            transition: 0.15s;
        }
        .action-btn.outline {
            background: transparent;
            border: 2px solid #666;
            color: #ccc;
        }
        .action-btn.outline:hover { background: #222; border-color: #888; color: white; }
        .action-btn.liked { background: #333; border-color: #777; color: white; }
        .action-btn:hover { background: #3a3a3a; }

        /* detail modal - black elegance */
        .profile-detail-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 400;
            animation: fadeIn 0.2s;
        }
        .detail-card {
            max-width: 520px;
            width: 90%;
            background: #111;
            border-radius: 70px;
            padding: 36px;
            border: 1px solid #333;
            box-shadow: 0 40px 80px -20px black;
            transform: scale(0.95);
            animation: scaleIn 0.3s forwards;
        }
        .detail-avatar {
            width: 120px; height: 120px; border-radius: 120px;
            background: #2a2a2a;
            margin: 0 auto 24px;
            background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 3rem;
            border: 3px solid #444;
        }
        .detail-name { font-size: 2.4rem; font-weight: 700; text-align: center; color: #f0f0f0; }
        .detail-handle { text-align: center; color: #aaa; font-size: 1.2rem; margin-bottom: 24px; }
        .detail-bio {
            background: #1a1a1a;
            border-radius: 40px;
            padding: 24px;
            margin: 24px 0;
            border: 1px solid #333;
            color: #ccc;
        }
        .flex-stats {
            display: flex; justify-content: space-around; margin: 24px 0;
            color: #ddd;
        }

        .btn-primary {
            background: #2a2a2a;
            border: 1px solid #555;
            padding: 16px 32px;
            border-radius: 60px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-primary:hover { background: #3a3a3a; border-color: #888; }
        .btn-secondary {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 600;
            color: #ccc;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-secondary:hover { background: #252525; border-color: #555; color: white; }
        .w-100 { width: 100%; }

        /* auth - monochrome */
        .auth-tabs { display: flex; gap: 12px; margin-bottom: 28px; }
        .auth-tab {
            flex:1; background: transparent; border: none; padding: 14px 0;
            font-weight: 700; font-size: 1.2rem;
            color: #666; border-bottom: 3px solid #222; cursor: pointer;
            transition: 0.2s;
        }
        .auth-tab.active { color: #fff; border-bottom-color: #aaa; }
        .input-group { margin-bottom: 24px; }
        .input-group input, .input-group textarea {
            width:100%; padding:16px 22px; border-radius:60px;
            border:1px solid #333; background:#1a1a1a; color:#eee;
            transition: 0.15s;
        }
        .input-group input:focus, .input-group textarea:focus {
            border-color: #777; outline: none; background: #1f1f1f;
        }
        .micro-tip { text-align: center; margin-top:20px; color: #888; }
        .micro-tip button { background:none; border:none; color:#ccc; font-weight:600; cursor:pointer; }
        .micro-tip button:hover { color: white; }
        .hidden { display:none; }
        .empty-state { text-align: center; padding: 60px 20px; color: #666; }

        /* scrollbar - dark */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body>
    <!-- AUTH MODULE -->
    <div id="authWrapper">
        <div class="glass-card" style="padding: 36px;">
            <div style="display:flex; gap:12px; align-items:center; margin-bottom:20px;">
                <i class="fas fa-cat" style="font-size:2.5rem; color:#aaa;"></i>
                <span style="font-size:2.2rem; font-weight:600; letter-spacing:-1px; color:white;">kittybin.lat</span>
            </div>
            <div class="auth-tabs">
                <button id="tabLogin" class="auth-tab active">log in</button>
                <button id="tabSignup" class="auth-tab">sign up</button>
            </div>
            <!-- login -->
            <div id="loginPanel">
                <div class="input-group"><input type="email" id="loginEmail" placeholder="your@email.com"></div>
                <div class="input-group"><input type="password" id="loginPassword" placeholder="password"></div>
                <button class="btn-primary w-100" onclick="handleLogin()">sign in</button>
                <div class="micro-tip">new here? <button onclick="switchAuthTab('signup')">create profile</button></div>
            </div>
            <!-- signup -->
            <div id="signupPanel" style="display:none;">
                <div class="input-group"><input type="email" id="signupEmail" placeholder="email"></div>
                <div class="input-group"><input type="password" id="signupPassword" placeholder="password (min 6)"></div>
                <div class="input-group"><input type="password" id="signupConfirm" placeholder="confirm password"></div>
                <div class="input-group"><input type="text" id="signupName" placeholder="display name"></div>
                <div class="input-group"><input type="text" id="signupUsername" placeholder="@username (optional)"></div>
                <div class="input-group"><textarea id="signupBio" placeholder="tell about yourself..." rows="2"></textarea></div>
                <button class="btn-primary w-100" onclick="handleSignup()">create profile</button>
                <div class="micro-tip">have an account? <button onclick="switchAuthTab('login')">log in</button></div>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app">
        <!-- header -->
        <div class="app-header">
            <div class="logo"><i class="fas fa-cat"></i> <span>kittybin.lat</span></div>
            <div class="user-badge" id="profileBadge" onclick="toggleProfileDropdown()">
                <div class="avatar-small" id="headerAvatar">U</div>
                <div>
                    <div class="badge-text" id="headerDisplayName">Display</div>
                    <div class="badge-handle" id="headerHandle">@handle</div>
                </div>
                <i class="fas fa-chevron-down" style="color:#666; font-size:0.8rem;"></i>
            </div>
        </div>

        <!-- edit profile dropdown -->
        <div class="dropdown-panel" id="profileDropdown">
            <div class="avatar-large" id="modalAvatar">U</div>
            <div class="profile-field"><label>DISPLAY NAME</label><input type="text" id="profileDisplayName" placeholder="Your name"></div>
            <div class="profile-field"><label>USERNAME</label><input type="text" id="profileUsername" placeholder="@username"></div>
            <div class="profile-field"><label>BIO</label><textarea id="profileBio" placeholder="Tell about yourself" rows="2"></textarea></div>
            <div class="profile-field"><label>AVATAR URL</label><div class="avatar-upload"><input type="url" id="profileAvatarUrl" placeholder="https://..."><button onclick="updateProfile()">save</button></div></div>
            <div style="display:flex; gap:8px;"><button class="btn-secondary" style="flex:1;" onclick="toggleProfileDropdown()">close</button><button class="btn-primary" style="flex:1;" onclick="updateProfile()">update</button></div>
        </div>

        <!-- main explorer layout -->
        <div class="explore-layout">
            <!-- left panel: my profile summary -->
            <div class="side-panel">
                <div class="my-profile-card" onclick="viewProfile(currentUser.id)">
                    <div class="my-avatar" id="myAvatarSide">U</div>
                    <div class="my-name" id="myNameSide">Name</div>
                    <div class="my-handle" id="myHandleSide">@handle</div>
                    <div class="my-bio" id="myBioSide">bio</div>
                    <div class="stat-row">
                        <div class="stat"><span class="stat-num" id="followersCount">0</span><div class="stat-label">followers</div></div>
                        <div class="stat"><span class="stat-num" id="followingCount">0</span><div class="stat-label">following</div></div>
                    </div>
                </div>

                <div style="margin-top: 10px;">
                    <div class="nav-button active" id="navExplore" onclick="switchView('explore')"><i class="fas fa-compass"></i> Explore</div>
                    <div class="nav-button" id="navFollowing" onclick="switchView('following')"><i class="fas fa-heart"></i> Following</div>
                </div>
            </div>

            <!-- main content (dynamic) -->
            <div class="main-area" id="mainContent">
                <div class="empty-state"><i class="fas fa-cat"></i><p>loading kittybin users ...</p></div>
            </div>
        </div>
    </div>

    <!-- profile detail modal -->
    <div class="profile-detail-overlay" id="profileDetailOverlay" onclick="if(event.target===this) closeProfileDetail()">
        <div class="detail-card" id="detailCard"></div>
    </div>

    <script>
        (function() {
            // Supabase init
            const supabase = window.supabase.createClient(
                "https://ylgtgecqhdhakzbjdkqq.supabase.co",
                "sb_publishable_ILF6pER_bdL8GppxOzfumg_xsDoMA6T"
            );

            // ---------- SQL to run once (IF NOT EXISTS) ----------
            /*
            CREATE TABLE IF NOT EXISTS profiles (
                id UUID REFERENCES auth.users PRIMARY KEY,
                email TEXT,
                display_name TEXT,
                username TEXT UNIQUE,
                bio TEXT,
                avatar_url TEXT,
                created_at TIMESTAMP DEFAULT NOW()
            );
            CREATE TABLE IF NOT EXISTS follows (
                id SERIAL PRIMARY KEY,
                follower_id UUID REFERENCES profiles(id),
                following_id UUID REFERENCES profiles(id),
                created_at TIMESTAMP DEFAULT NOW(),
                UNIQUE(follower_id, following_id)
            );
            CREATE TABLE IF NOT EXISTS profile_likes (
                id SERIAL PRIMARY KEY,
                user_id UUID REFERENCES profiles(id),
                liked_user_id UUID REFERENCES profiles(id),
                created_at TIMESTAMP DEFAULT NOW(),
                UNIQUE(user_id, liked_user_id)
            );
            CREATE INDEX IF NOT EXISTS idx_follows_follower ON follows(follower_id);
            CREATE INDEX IF NOT EXISTS idx_follows_following ON follows(following_id);
            */

            // State
            let currentUser = null;
            let profile = {
                id: null,
                email: '',
                display_name: '',
                username: '',
                bio: '',
                avatar_url: ''
            };
            let allUsers = [];
            let followingMap = new Map();
            let likesMap = new Map();
            let followersCount = 0;
            let followingCount = 0;
            let currentView = 'explore';

            // DOM elements
            const authWrapper = document.getElementById('authWrapper');
            const appEl = document.getElementById('app');
            const loginPanel = document.getElementById('loginPanel');
            const signupPanel = document.getElementById('signupPanel');
            const tabLogin = document.getElementById('tabLogin');
            const tabSignup = document.getElementById('tabSignup');
            const headerAvatar = document.getElementById('headerAvatar');
            const headerDisplayName = document.getElementById('headerDisplayName');
            const headerHandle = document.getElementById('headerHandle');
            const myAvatarSide = document.getElementById('myAvatarSide');
            const myNameSide = document.getElementById('myNameSide');
            const myHandleSide = document.getElementById('myHandleSide');
            const myBioSide = document.getElementById('myBioSide');
            const followersSpan = document.getElementById('followersCount');
            const followingSpan = document.getElementById('followingCount');
            const profileDropdown = document.getElementById('profileDropdown');
            const modalAvatar = document.getElementById('modalAvatar');
            const profileDisplayName = document.getElementById('profileDisplayName');
            const profileUsername = document.getElementById('profileUsername');
            const profileBio = document.getElementById('profileBio');
            const profileAvatarUrl = document.getElementById('profileAvatarUrl');
            const mainContent = document.getElementById('mainContent');
            const detailOverlay = document.getElementById('profileDetailOverlay');
            const detailCard = document.getElementById('detailCard');
            const navExplore = document.getElementById('navExplore');
            const navFollowing = document.getElementById('navFollowing');

            // ---------- Helper: update UI from profile ----------
            function refreshProfileUI() {
                if (!currentUser || !profile) return;
                const name = profile.display_name || currentUser.email?.split('@')[0] || 'User';
                const handle = profile.username ? '@' + profile.username : '';
                headerDisplayName.innerText = name;
                headerHandle.innerText = handle || '';

                if (profile.avatar_url) {
                    headerAvatar.style.backgroundImage = `url('${profile.avatar_url}')`;
                    headerAvatar.innerText = '';
                    myAvatarSide.style.backgroundImage = `url('${profile.avatar_url}')`;
                    myAvatarSide.innerText = '';
                    modalAvatar.style.backgroundImage = `url('${profile.avatar_url}')`;
                    modalAvatar.innerText = '';
                } else {
                    headerAvatar.style.backgroundImage = '';
                    headerAvatar.innerText = name.charAt(0).toUpperCase();
                    myAvatarSide.style.backgroundImage = '';
                    myAvatarSide.innerText = name.charAt(0).toUpperCase();
                    modalAvatar.style.backgroundImage = '';
                    modalAvatar.innerText = name.charAt(0).toUpperCase();
                }
                myNameSide.innerText = name;
                myHandleSide.innerText = handle || '@handle';
                myBioSide.innerText = profile.bio || 'silent paw';
                followersSpan.innerText = followersCount;
                followingSpan.innerText = followingCount;

                profileDisplayName.value = profile.display_name || '';
                profileUsername.value = profile.username || '';
                profileBio.value = profile.bio || '';
                profileAvatarUrl.value = profile.avatar_url || '';
            }

            async function ensureProfileInDB(user) {
                const { data: existing } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', user.id)
                    .maybeSingle();

                if (!existing) {
                    const { error } = await supabase
                        .from('profiles')
                        .insert({
                            id: user.id,
                            email: user.email,
                            display_name: user.user_metadata?.display_name || user.email.split('@')[0],
                            username: user.user_metadata?.username || '',
                            bio: user.user_metadata?.bio || '',
                            avatar_url: user.user_metadata?.avatar_url || ''
                        });
                    if (error) console.warn('profile insert', error);
                }
                await loadProfileFromDB(user.id);
            }

            async function loadProfileFromDB(userId) {
                const { data, error } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', userId)
                    .single();
                if (error) return;
                if (data) {
                    profile = data;
                    const { count: f1 } = await supabase
                        .from('follows')
                        .select('*', { count: 'exact', head: true })
                        .eq('following_id', userId);
                    followersCount = f1 || 0;
                    const { count: f2 } = await supabase
                        .from('follows')
                        .select('*', { count: 'exact', head: true })
                        .eq('follower_id', userId);
                    followingCount = f2 || 0;
                    refreshProfileUI();
                }
            }

            async function loadAllUsers() {
                if (!currentUser) return;
                const { data, error } = await supabase
                    .from('profiles')
                    .select('*');
                if (error) return;
                allUsers = data || [];

                const { data: follows } = await supabase
                    .from('follows')
                    .select('following_id')
                    .eq('follower_id', currentUser.id);
                followingMap.clear();
                follows?.forEach(f => followingMap.set(f.following_id, true));

                const { data: likes } = await supabase
                    .from('profile_likes')
                    .select('liked_user_id')
                    .eq('user_id', currentUser.id);
                likesMap.clear();
                likes?.forEach(l => likesMap.set(l.liked_user_id, true));

                renderExplore();
            }

            // ---------- Follow / Like ----------
            window.toggleFollow = async function(targetUserId, event) {
                if (event) event.stopPropagation();
                if (!currentUser || targetUserId === currentUser.id) return;

                if (followingMap.has(targetUserId)) {
                    await supabase
                        .from('follows')
                        .delete()
                        .eq('follower_id', currentUser.id)
                        .eq('following_id', targetUserId);
                    followingMap.delete(targetUserId);
                } else {
                    await supabase
                        .from('follows')
                        .insert({ follower_id: currentUser.id, following_id: targetUserId });
                    followingMap.set(targetUserId, true);
                }
                await loadProfileFromDB(currentUser.id);
                if (currentView === 'explore') renderExplore();
                else if (currentView === 'following') renderFollowing();
            };

            window.toggleLike = async function(targetUserId, event) {
                if (event) event.stopPropagation();
                if (!currentUser || targetUserId === currentUser.id) return;

                if (likesMap.has(targetUserId)) {
                    await supabase
                        .from('profile_likes')
                        .delete()
                        .eq('user_id', currentUser.id)
                        .eq('liked_user_id', targetUserId);
                    likesMap.delete(targetUserId);
                } else {
                    await supabase
                        .from('profile_likes')
                        .insert({ user_id: currentUser.id, liked_user_id: targetUserId });
                    likesMap.set(targetUserId, true);
                }
                if (currentView === 'explore') renderExplore();
                else if (currentView === 'following') renderFollowing();
            };

            // ---------- Render ----------
            function renderExplore() {
                let html = '<div class="section-title"><i class="fas fa-compass"></i> explore kittens</div>';
                html += '<div class="profiles-grid">';
                allUsers.forEach(p => {
                    if (p.id === currentUser.id) return;
                    const name = p.display_name || p.email?.split('@')[0];
                    const handle = p.username ? '@'+p.username : '';
                    const avatarStyle = p.avatar_url ? `background-image:url('${p.avatar_url}')` : '';
                    const isFollowing = followingMap.has(p.id);
                    const isLiked = likesMap.has(p.id);
                    html += `
                        <div class="profile-card" onclick="viewProfile('${p.id}')">
                            <div class="card-avatar" style="${avatarStyle};">${!avatarStyle ? name.charAt(0).toUpperCase() : ''}</div>
                            <div class="card-name">${name}</div>
                            <div class="card-handle">${handle}</div>
                            <div class="card-bio">${p.bio || '😼'}</div>
                            <div class="card-stats">
                                <span><i class="fas fa-heart" style="color:#aaa;"></i> ${Math.floor(Math.random()*30)}</span>
                                <span><i class="fas fa-user-friends"></i> ${Math.floor(Math.random()*20)}</span>
                            </div>
                            <div>
                                <button class="action-btn ${isFollowing ? 'outline' : ''}" onclick="toggleFollow('${p.id}', event)"><i class="fas fa-${isFollowing ? 'user-check' : 'user-plus'}"></i> ${isFollowing ? 'following' : 'follow'}</button>
                                <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${p.id}', event)"><i class="fas fa-heart"></i></button>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                mainContent.innerHTML = html;
            }

            async function renderFollowing() {
                const { data: following } = await supabase
                    .from('follows')
                    .select('following_id')
                    .eq('follower_id', currentUser.id);
                const followingIds = following?.map(f => f.following_id) || [];
                const followedUsers = allUsers.filter(p => followingIds.includes(p.id) && p.id !== currentUser.id);

                let html = '<div class="section-title"><i class="fas fa-heart"></i> your colony</div>';
                if (followedUsers.length === 0) {
                    html += '<div class="empty-state"><i class="fas fa-cat"></i><p>not following anyone yet</p><button class="btn-primary" onclick="switchView(\'explore\')">explore</button></div>';
                    mainContent.innerHTML = html; return;
                }

                html += '<div class="profiles-grid">';
                followedUsers.forEach(p => {
                    const name = p.display_name || p.email?.split('@')[0];
                    const handle = p.username ? '@'+p.username : '';
                    const avatarStyle = p.avatar_url ? `background-image:url('${p.avatar_url}')` : '';
                    html += `
                        <div class="profile-card" onclick="viewProfile('${p.id}')">
                            <div class="card-avatar" style="${avatarStyle};">${!avatarStyle ? name.charAt(0).toUpperCase() : ''}</div>
                            <div class="card-name">${name}</div>
                            <div class="card-handle">${handle}</div>
                            <div class="card-bio">${p.bio || '🐱'}</div>
                            <div><button class="action-btn outline" onclick="toggleFollow('${p.id}', event)"><i class="fas fa-user-minus"></i> unfollow</button></div>
                        </div>
                    `;
                });
                html += '</div>';
                mainContent.innerHTML = html;
            }

            // ---------- Profile detail ----------
            window.viewProfile = async function(userId) {
                const p = allUsers.find(u => u.id === userId) || profile;
                if (!p) return;
                const isMe = userId === currentUser.id;
                const name = p.display_name || p.email?.split('@')[0];
                const handle = p.username ? '@'+p.username : '';
                const avatarStyle = p.avatar_url ? `background-image:url('${p.avatar_url}')` : '';
                const isFollowing = followingMap.has(userId);
                const isLiked = likesMap.has(userId);

                const { count: likeCount } = await supabase
                    .from('profile_likes')
                    .select('*', { count: 'exact', head: true })
                    .eq('liked_user_id', userId);

                detailCard.innerHTML = `
                    <div class="detail-avatar" style="${avatarStyle};">${!avatarStyle ? name.charAt(0).toUpperCase() : ''}</div>
                    <div class="detail-name">${name}</div>
                    <div class="detail-handle">${handle}</div>
                    <div class="detail-bio">${p.bio || 'purr'}</div>
                    <div class="flex-stats">
                        <div class="stat"><span class="stat-num">${likeCount || 0}</span><div>likes</div></div>
                        <div class="stat"><span class="stat-num">${Math.floor(Math.random()*30)}</span><div>followers</div></div>
                    </div>
                    ${!isMe ? `
                        <div style="display:flex; gap:8px;">
                            <button class="btn-primary" style="flex:1;" onclick="toggleFollow('${userId}', event); closeProfileDetail();"><i class="fas fa-${isFollowing ? 'user-check' : 'user-plus'}"></i> ${isFollowing ? 'unfollow' : 'follow'}</button>
                            <button class="btn-secondary" style="flex:1;" onclick="toggleLike('${userId}', event); closeProfileDetail();"><i class="fas fa-heart" style="color:${isLiked ? '#aaa' : ''}"></i> ${isLiked ? 'unlike' : 'like'}</button>
                        </div>
                    ` : ''}
                    <button class="btn-secondary w-100" style="margin-top:12px;" onclick="closeProfileDetail()">close</button>
                `;
                detailOverlay.style.display = 'flex';
            };

            window.closeProfileDetail = function() { detailOverlay.style.display = 'none'; };

            // ---------- Auth ----------
            window.switchAuthTab = function(tab) {
                if (tab === 'login') {
                    loginPanel.style.display = 'block'; signupPanel.style.display = 'none';
                    tabLogin.classList.add('active'); tabSignup.classList.remove('active');
                } else {
                    loginPanel.style.display = 'none'; signupPanel.style.display = 'block';
                    tabSignup.classList.add('active'); tabLogin.classList.remove('active');
                }
            };
            tabLogin.addEventListener('click', () => switchAuthTab('login'));
            tabSignup.addEventListener('click', () => switchAuthTab('signup'));

            window.handleSignup = async function() {
                const email = document.getElementById('signupEmail').value.trim();
                const pass = document.getElementById('signupPassword').value;
                const confirm = document.getElementById('signupConfirm').value;
                const disp = document.getElementById('signupName').value.trim() || email.split('@')[0];
                const username = document.getElementById('signupUsername').value.trim();
                const bio = document.getElementById('signupBio').value.trim();
                if (!email || !pass) return alert('fill required');
                if (pass !== confirm) return alert('pass mismatch');
                const { data, error } = await supabase.auth.signUp({
                    email, password: pass,
                    options: { data: { display_name: disp, username, bio, avatar_url: '' } }
                });
                if (error) alert(error.message);
                else { alert('profile created! check email, then log in.'); switchAuthTab('login'); }
            };

            window.handleLogin = async function() {
                const email = document.getElementById('loginEmail').value.trim();
                const pass = document.getElementById('loginPassword').value;
                const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
                if (error) alert(error.message);
                else {
                    currentUser = data.user;
                    await ensureProfileInDB(currentUser);
                    await loadAllUsers();
                    authWrapper.style.display = 'none';
                    appEl.style.display = 'flex';
                    appEl.style.flexDirection = 'column';
                }
            };

            window.handleLogout = async function() {
                await supabase.auth.signOut();
                currentUser = null;
                appEl.style.display = 'none';
                authWrapper.style.display = 'block';
                profileDropdown.classList.remove('show');
                switchAuthTab('login');
            };

            window.updateProfile = async function() {
                if (!currentUser) return;
                const newDisplay = profileDisplayName.value.trim() || currentUser.email?.split('@')[0];
                const newUsername = profileUsername.value.trim();
                const newBio = profileBio.value.trim();
                const newAvatar = profileAvatarUrl.value.trim();

                await supabase.auth.updateUser({
                    data: { display_name: newDisplay, username: newUsername, bio: newBio, avatar_url: newAvatar }
                });

                const { error } = await supabase
                    .from('profiles')
                    .update({
                        display_name: newDisplay,
                        username: newUsername,
                        bio: newBio,
                        avatar_url: newAvatar
                    })
                    .eq('id', currentUser.id);

                if (error) alert(error.message);
                else {
                    profile.display_name = newDisplay;
                    profile.username = newUsername;
                    profile.bio = newBio;
                    profile.avatar_url = newAvatar;
                    refreshProfileUI();
                    alert('profile updated');
                    toggleProfileDropdown();
                    await loadAllUsers();
                }
            };

            window.toggleProfileDropdown = function() {
                profileDropdown.classList.toggle('show');
            };

            window.switchView = function(view) {
                currentView = view;
                if (view === 'explore') {
                    navExplore.classList.add('active');
                    navFollowing.classList.remove('active');
                    renderExplore();
                } else {
                    navExplore.classList.remove('active');
                    navFollowing.classList.add('active');
                    renderFollowing();
                }
            };

            document.addEventListener('click', function(e) {
                if (!profileDropdown.contains(e.target) && !document.getElementById('profileBadge').contains(e.target)) {
                    profileDropdown.classList.remove('show');
                }
            });

            async function restoreSession() {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    currentUser = session.user;
                    await ensureProfileInDB(currentUser);
                    await loadAllUsers();
                    authWrapper.style.display = 'none';
                    appEl.style.display = 'flex';
                    appEl.style.flexDirection = 'column';
                }
            }
            restoreSession();
        })();
    </script>
</body>
</html>
